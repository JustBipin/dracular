# CraftMaster settings for the Windows CI build.
#
# New file (nothing upstream to conflict with): rebase-safe. Shaped
# after other projects building Windows installers with CraftMaster.
[General]
Command = craft
ShallowClone = True

[GeneralSettings]
Version/ConfigVersion = 6

ShortPath/Enabled = False
Compile/BuildType = RelWithDebInfo
ContinuousIntegration/Enabled = True
Packager/Destination = ${Variables:WORKSPACE}/packages
Packager/PackageDebugSymbols = False

[BlueprintSettings]
kde/applications/okular.version = master

[windows-msvc2022_64-cl]
General/ABI = windows-msvc2022_64-cl
